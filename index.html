<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo Setor XI</title>
  <meta name="description" content="O manto que representa a sua torcida. Camisas de seleções, clubes, clássicos retrô e edições especiais. Vista o Jogo. Viva o Esporte." />
  <link rel="icon" href="img/logo-reverse-sm.png" />
  <link rel="preload" as="image" href="img/logo-reverse-sm.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Setor XI" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:title" content="Catálogo Setor XI" />
  <meta property="og:description" content="O manto que representa a sua torcida. Seleções, clubes, retrô e edições especiais. Vista o Jogo." />
  <meta property="og:image" content="img/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Catálogo Setor XI" />
  <meta name="twitter:description" content="Seleções, clubes, retrô e edições especiais. Vista o Jogo." />
  <meta name="twitter:image" content="img/og.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="category-bg" aria-hidden="true">
    <div class="category-bg__layer"></div>
    <div class="category-bg__layer"></div>
  </div>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="#" aria-label="Setor XI — Vista o Jogo, Viva o Esporte">
        <img class="brand__logo" src="img/logo-reverse-sm.png" alt="Setor XI" width="215" height="200" />
      </a>
      <span class="site-header__tag">Catálogo 2026</span>
    </div>
  </header>

  <section class="hero">
    <div class="container hero__inner">
      <p class="hero__kicker">Setor XI — direto da arquibancada</p>
      <h1 class="hero__title"><span>Vista</span><span>o Jogo</span></h1>
      <p class="hero__lead">
        O manto que representa a sua torcida. Seleções, clubes, clássicos
        retrô e edições especiais.
      </p>
      <a class="hero__cta" href="#catalogo">Ver o catálogo</a>
    </div>
    <a class="hero__scroll" href="#catalogo" aria-label="Ir para o catálogo">
      <span aria-hidden="true">&#8595;</span>
    </a>
  </section>

  <nav class="catalog-nav" id="catalogo" aria-label="Categorias">
    <div class="container catalog-nav__inner">
      <div class="filters" id="filters" role="group" aria-label="Filtrar por categoria"></div>
      <p class="catalog-nav__count" id="result-count"></p>
    </div>
  </nav>

  <main class="container">
    <section class="grid" id="product-grid" aria-live="polite"></section>
    <noscript>
      <p style="padding: 40px 0; color: #9a9a9a">
        Ative o JavaScript para ver o catálogo. Ou fale com a gente:
        <a href="https://instagram.com/setorxi" style="color: #1fdd6d">@setorxi</a>.
      </p>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <img class="site-footer__logo" src="img/logo-reverse-sm.png" alt="Setor XI" width="215" height="200" />
      <nav class="site-footer__contact" aria-label="Contato">
        <a href="https://instagram.com/setorxi" target="_blank" rel="noopener">@setorxi</a>
        <a href="https://wa.me/5545991271005" target="_blank" rel="noopener">WhatsApp (45) 99127-1005</a>
      </nav>
      <span class="site-footer__meta">© 2026 Setor XI · Vista o Jogo</span>
    </div>
  </footer>

  <!-- Dados do catálogo: edite products.js -->
  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
